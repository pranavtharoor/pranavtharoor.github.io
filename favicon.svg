<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Pranav Tharoor">
  <!-- TP monogram badge, supplied as finished artwork, not drawn as a path
       like the previous serif-P mark. Embedded as a raster data URI rather
       than traced to vector, since tracing the ring's antialiased edge and
       the overlapping serif strokes would have meant redrawing the design,
       not just converting its format. Palette-quantized to 64 colours: this
       is flat regions plus soft edges, not a photo, so it loses nothing
       visible and drops from roughly 200KB to a few KB, which matters here
       since /favicon.svg loads on every page. Kept as one <image> so the
       existing href in every page keeps resolving. -->
  <image width="160" height="160" href="data:image/png;base64,"/>
</svg>
